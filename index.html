<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #333;
        }
        #global-summary {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        #global-summary h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.2em;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .summary-item {
            text-align: left;
        }
        .summary-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        .summary-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c3e50;
        }
        #table-container {
            margin: 20px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background-color: #f4f4f4;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #ddd;
            font-weight: bold;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .loading {
            color: #666;
            font-style: italic;
            padding: 20px;
        }
        .error {
            color: #d32f2f;
            font-weight: bold;
            padding: 20px;
        }
        .positive {
            color: #2e7d32;
            font-weight: bold;
        }
        .negative {
            color: #c62828;
            font-weight: bold;
        }
        .coin-name {
            font-weight: bold;
        }
        .num-cell {
            text-align: right;
        }
        .summary-timestamp {
            font-size: 0.85em;
            color: #666;
            margin-top: 12px;
        }
        /* Correlation section: matches global-summary styling for visual consistency */
        #correlation-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        #correlation-section h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.2em;
        }
        .correlation-row {
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }
        .correlation-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h1>Crypto Market Dashboard</h1>
    
    <!-- Global Market Summary Header -->
    <div id="global-summary">
        <h2>Global Market Summary</h2>
        <div id="global-content" class="loading">Loading global metrics...</div>
        <div id="last-updated" class="summary-timestamp" aria-live="polite"></div>
    </div>
    
    <!-- Coin Table -->
    <div id="table-container">
        <div id="content" class="loading">Loading coin data...</div>
    </div>

    <!-- 30-Day Correlations: placed below coin table so user sees price/volatility first, then correlations -->
    <div id="correlation-section">
        <h2>30-Day Correlations</h2>
        <div id="correlation-content" class="loading">Loading...</div>
    </div>

    <script>
        // Single endpoint for dashboard data (global + coins + meta). Used for initial load and polling.
        const SUMMARY_API_URL = 'http://localhost:8000/api/summary';
        // Correlation endpoint: returns [{coin_a, coin_b, correlation_30d, last_updated}, ...]
        const CORRELATIONS_API_URL = 'http://localhost:8000/api/correlations';
        const POLL_INTERVAL_MS = 120000; // 2 minutes - refresh without page reload

        // Get references to the DOM elements
        const contentDiv = document.getElementById('content');
        const globalContentDiv = document.getElementById('global-content');
        const lastUpdatedEl = document.getElementById('last-updated');
        const correlationContentDiv = document.getElementById('correlation-content');

        // True after at least one successful fetch. Used to avoid overwriting DOM with errors on poll.
        let hasLoadedOnce = false;
        
        // Function to format a number as currency (USD)
        // Takes a number and returns a formatted string like "$45,000.50"
        function formatCurrency(value) {
            // toLocaleString() formats numbers with locale-specific formatting
            // 'en-US' specifies US format, style: 'currency' adds $ symbol
            return value.toLocaleString('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }
        
        // Function to format a percentage value
        // Takes a number and returns a formatted string like "2.50%"
        function formatPercent(value) {
            // toFixed(2) rounds to 2 decimal places
            // Add the % symbol at the end
            return value.toFixed(2) + '%';
        }

        // Formats volatility as a percentage. Handles null/undefined/missing.
        function formatVolatility(value) {
            if (value == null || value === undefined || (typeof value === 'number' && isNaN(value))) {
                return 'N/A';
            }
            const num = Number(value);
            if (isNaN(num)) return 'N/A';
            return Math.abs(num).toFixed(2) + '%';
        }

        // Formats a correlation value (float between -1 and 1) to 2 decimal places.
        // We do not recompute correlation here; we only display what the backend stored.
        // Rounding improves readability (e.g. 0.8473 -> "0.85").
        // Handles null, undefined, NaN, and clamps out-of-range values for safety.
        function formatCorrelation(value) {
            if (value == null || value === undefined || (typeof value === 'number' && isNaN(value))) {
                return 'N/A';
            }
            const num = Number(value);
            if (isNaN(num)) return 'N/A';
            // Clamp to [-1, 1] in case backend ever returns invalid data
            const clamped = Math.max(-1, Math.min(1, num));
            return clamped.toFixed(2);
        }
        
        // Function to format a large number (for volume)
        // Takes a number and returns a formatted string like "$25,000,000,000"
        function formatVolume(value) {
            // Use toLocaleString() to add commas for readability
            // Then add $ symbol manually since we're not using currency style
            return '$' + value.toLocaleString('en-US', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            });
        }
        
        // Function to format large numbers with abbreviations (B for billions, T for trillions)
        // Takes a number and returns a formatted string like "$1.2T" or "$950B"
        function formatLargeNumber(value) {
            // 1 trillion = 1,000,000,000,000
            // If value is >= 1 trillion, divide by 1 trillion and add "T"
            if (value >= 1000000000000) {
                const trillions = value / 1000000000000;
                // toFixed(1) rounds to 1 decimal place
                return '$' + trillions.toFixed(1) + 'T';
            }
            // 1 billion = 1,000,000,000
            // If value is >= 1 billion, divide by 1 billion and add "B"
            else if (value >= 1000000000) {
                const billions = value / 1000000000;
                // toFixed(1) rounds to 1 decimal place
                return '$' + billions.toFixed(1) + 'B';
            }
            // For values less than 1 billion, use regular formatting with commas
            else {
                return '$' + value.toLocaleString('en-US', {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                });
            }
        }
        
        // Renders global summary from /api/summary response.global. Reused on initial load and each poll.
        function renderGlobalSummary(globalData) {
            if (!globalData) return;
            let summaryHTML = '<div class="summary-grid">';
            summaryHTML += '<div class="summary-item"><div class="summary-label">Total Market Cap</div>';
            summaryHTML += `<div class="summary-value">${formatLargeNumber(globalData.total_market_cap_usd)}</div></div>`;
            summaryHTML += '<div class="summary-item"><div class="summary-label">Total 24h Volume</div>';
            summaryHTML += `<div class="summary-value">${formatLargeNumber(globalData.total_volume_24h_usd)}</div></div>`;
            summaryHTML += '<div class="summary-item"><div class="summary-label">Bitcoin Dominance</div>';
            summaryHTML += `<div class="summary-value">${formatPercent(globalData.btc_dominance_percent)}</div></div>`;
            summaryHTML += '</div>';
            globalContentDiv.className = '';
            globalContentDiv.innerHTML = summaryHTML;
        }

        // Renders coin table from /api/summary response.coins. Reused on initial load and each poll.
        function renderCoinsTable(coins) {
            if (!Array.isArray(coins) || coins.length === 0) return;
            let tableHTML = '<table><thead><tr>';
            tableHTML += '<th>Coin Name</th><th class="num-cell">Price (USD)</th><th class="num-cell">24h Change (%)</th>';
            tableHTML += '<th class="num-cell">24h Volume (USD)</th><th class="num-cell">30d Volatility (%)</th></tr></thead><tbody>';
            coins.forEach(function(coin) {
                const changeClass = (coin.change_24h >= 0) ? 'positive' : 'negative';
                tableHTML += `<tr><td class="coin-name">${coin.name}</td><td class="num-cell">${formatCurrency(coin.price_usd)}</td>`;
                tableHTML += `<td class="num-cell ${changeClass}">${formatPercent(coin.change_24h)}</td><td class="num-cell">${formatVolume(coin.volume_24h_usd)}</td>`;
                tableHTML += `<td class="num-cell">${formatVolatility(coin.volatility_30d)}</td></tr>`;
            });
            tableHTML += '</tbody></table>';
            contentDiv.className = '';
            contentDiv.innerHTML = tableHTML;
        }

        // Renders correlation data from /api/correlations response.
        // Expects array of {coin_a, coin_b, correlation_30d, last_updated}.
        // Displays as "BTC - ETH: 0.85" (uppercase for readability).
        // Handles empty list, null/undefined, and missing fields per entry.
        function renderCorrelations(correlations) {
            if (!correlationContentDiv) return;
            if (!Array.isArray(correlations) || correlations.length === 0) {
                correlationContentDiv.className = '';
                correlationContentDiv.textContent = 'No correlation data available';
                return;
            }
            let html = '';
            correlations.forEach(function(entry) {
                const coinA = (entry && entry.coin_a != null) ? String(entry.coin_a).toUpperCase() : '?';
                const coinB = (entry && entry.coin_b != null) ? String(entry.coin_b).toUpperCase() : '?';
                const corr = formatCorrelation(entry && entry.correlation_30d);
                html += '<div class="correlation-row">' + coinA + ' - ' + coinB + ': ' + corr + '</div>';
            });
            correlationContentDiv.className = '';
            correlationContentDiv.innerHTML = html;
        }

        // Updates the "last updated" line from meta.last_updated (ISO string). Keeps UI in sync with data age.
        function updateLastUpdated(isoString) {
            if (!lastUpdatedEl || !isoString) return;
            try {
                const date = new Date(isoString);
                lastUpdatedEl.textContent = 'Last updated: ' + date.toLocaleString();
            } catch (_) {
                lastUpdatedEl.textContent = 'Last updated: ' + isoString;
            }
        }

        // Fetches /api/summary and updates the DOM. Used for initial load and by setInterval.
        // On error: log and, if we have never loaded, show error in DOM; otherwise keep last data (no flicker).
        // Correlation fetch runs in the same refresh cycle (single refresh source) so all sections update together.
        async function refreshData() {
            try {
                const response = await fetch(SUMMARY_API_URL);
                if (!response.ok) {
                    const err = await response.json().catch(function() { return {}; });
                    throw new Error(err.detail || 'Failed to fetch summary');
                }
                const data = await response.json();
                if (data.global) renderGlobalSummary(data.global);
                if (data.coins) renderCoinsTable(data.coins);
                if (data.meta && data.meta.last_updated) updateLastUpdated(data.meta.last_updated);
                hasLoadedOnce = true;
            } catch (error) {
                console.error('Dashboard refresh failed:', error.message);
                if (!hasLoadedOnce) {
                    globalContentDiv.className = 'error';
                    globalContentDiv.innerHTML = 'Error: ' + error.message;
                    contentDiv.className = 'error';
                    contentDiv.innerHTML = 'Error: ' + error.message;
                }
                // Else: keep existing DOM so user keeps seeing last good data
            }

            // Fetch correlations in the same refresh cycle. Separate try/catch so correlation
            // failures do not affect summary/coins display. UI fails safely: show error in section only.
            try {
                const corrResponse = await fetch(CORRELATIONS_API_URL);
                if (corrResponse.ok) {
                    const correlations = await corrResponse.json();
                    renderCorrelations(correlations);
                } else {
                    if (correlationContentDiv) {
                        correlationContentDiv.className = 'error';
                        correlationContentDiv.textContent = 'Failed to load correlations';
                    }
                }
            } catch (corrError) {
                console.error('Correlation fetch failed:', corrError.message);
                if (correlationContentDiv) {
                    correlationContentDiv.className = 'error';
                    correlationContentDiv.textContent = 'Error loading correlations';
                }
            }
        }

        // Initial fetch on load, then poll every 2 minutes. setInterval keeps logic isolated and easy to change.
        window.addEventListener('load', function() {
            refreshData();
            setInterval(refreshData, POLL_INTERVAL_MS);
        });
    </script>
</body>
</html>
